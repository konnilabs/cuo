name: CUO checks
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.1'}
      - run: npm install --global npm@11.17.0
      - run: |
          go test -race ./...
          go vet ./...
          node --test tools/test/*.test.mjs
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          node tools/generate-api.mjs
          git diff --exit-code docs/openapi.json console/src/generated-api.ts
      - working-directory: console
        run: |
          npm run setup
          node ../tools/generate-notices.mjs --check
          npm run build
          npm test
          npm audit --prefix runtime --audit-level=high
          cd .framework
          npm audit --audit-level=high --workspace=@ccslabs/xtend-cli --workspace=@ccslabs/xtend-maraca --workspace=@ccslabs/xtend-rmt --workspace=@ccslabs/xtend-compiler --include-workspace-root
      - name: Disposable Docker update
        run: |
          CUO_DOCKER_E2E=1 go test -v ./internal/agent -run TestDisposableDockerUpdate -count=1
          CUO_DOCKER_E2E=1 go test -v ./internal/core -run 'TestDurableCoreDockerUpdate|TestDisposableBulkRun' -count=1
      - name: Install fresh test stack
        run: |
          mkdir -p work
          umask 077
          node -e "const c=require('node:crypto');require('node:fs').writeFileSync('work/ci.env','CUO_CORE_TOKEN='+c.randomBytes(32).toString('hex')+'\nCUO_AGENT_TOKEN='+c.randomBytes(32).toString('hex')+'\nCUO_ORIGIN=http://127.0.0.1:8096\nCUO_PORT=8096\n')"
          docker run -d --name cuo-ci-fixture busybox:1.37.0 sleep 3600
          docker compose --env-file work/ci.env -p cuo-ci build
          ./tools/prepare-secrets.sh
          docker compose --env-file work/ci.env -p cuo-ci up -d --no-build --wait
          npm install --prefix work/browser playwright@1.62.1
          work/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Disposable Compose reconciliation
        run: |
          node tools/verify-compose.mjs
          CUO_DOCKER_E2E=1 go test -v ./internal/agent -run TestDisposableComposeReconcile -count=1
      - name: Private registry and optional Zot restore
        run: |
          docker pull "$(node -p 'JSON.parse(require("node:fs").readFileSync("dependencies/zot/zot.lock.json")).image')"
          CUO_DOCKER_E2E=1 go test -v ./internal/agent -run TestPrivateZotScanCopyAndDockerUpdate -count=1
          node tools/test-restore.mjs
          CUO_RESTORE_REGISTRY=1 CUO_RESTORE_REPORT=reports/restore-zot-test.json node tools/test-restore.mjs
      - name: Browser and auth integration
        env:
          CUO_TEST_ORIGIN: http://127.0.0.1:8096
          CUO_TEST_OUTPUT: reports/browser
        run: |
          CUO_PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright/index.mjs" node console/test/browser.mjs
          CUO_PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright/index.mjs" CUO_EXTENSIONS_OUTPUT=reports/extensions-browser node console/test/extensions-browser.mjs
          CUO_PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright/index.mjs" CUO_APPEARANCE_OUTPUT=reports/appearance-browser node console/test/appearance-browser.mjs
          CUO_PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright/index.mjs" node console/test/auth-appearance-browser.mjs
          CUO_PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright/index.mjs" CUO_LAYOUT_OUTPUT=reports/dashboard-layout-browser node console/test/dashboard-layout-browser.mjs
          CUO_PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright/index.mjs" CUO_SIDEBAR_OUTPUT=reports/sidebar-browser node console/test/sidebar-browser.mjs
          go build -o "$RUNNER_TEMP/cuo-core-test" ./cmd/cuo
          CUO_CORE_BINARY="$RUNNER_TEMP/cuo-core-test" CUO_PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright/index.mjs" CUO_INTEGRATIONS_OUTPUT=reports/integrations-browser node console/test/integrations-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CUO verification
          path: |
            reports/
            console/reports/
      - name: Clean up test resources
        if: always()
        run: |
          docker compose --env-file work/ci.env -p cuo-ci down -v
          docker rm -f cuo-ci-fixture
